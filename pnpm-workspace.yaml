shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  dev:
    '@antfu/eslint-config': ^6.0.0
    '@types/node': ^22.19.3
    eslint: ^9.39.2
    devmoji: ^2.3.0
    simple-git-hooks: ^2.13.1
    turbo: ^2.6.3
    typescript: ^5.9.3
    vitest: ^4.0.15
  frontend:
    '@vitejs/plugin-vue': ^6.0.2
    vite: ^7.2.7
    vue-tsc: ^3.1.8
  prod:
    vue: ^3.5.24
  tauri:
    '@tauri-apps/api': ^2.9.0
    '@tauri-apps/cli': ^2.9.4
