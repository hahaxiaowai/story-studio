shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

catalogs:
  dev:
    '@antfu/eslint-config': ^6.0.0
    '@types/node': ^22.19.3
    '@types/three': ^0.184.1
    devmoji: ^2.3.0
    eslint: ^9.39.2
    simple-git-hooks: ^2.13.1
    turbo: ^2.6.3
    typescript: ^6.0.3
    vitest: ^4.0.15
  frontend:
    '@tailwindcss/vite': ^4.3.0
    '@vitejs/plugin-vue': ^6.0.2
    tailwindcss: ^4.3.0
    vite: ^7.2.7
    vue-tsc: ^3.1.8
  prod:
    '@lucide/vue': ^1.16.0
    '@vueuse/core': ^14.3.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    reka-ui: ^2.9.8
    tailwind-merge: ^3.6.0
    three: ^0.184.0
    tw-animate-css: ^1.4.0
    vue: ^3.5.24
    vue-draggable-plus: ^0.6.0
  tauri:
    '@tauri-apps/api': ^2.9.0
    '@tauri-apps/cli': ^2.9.4
