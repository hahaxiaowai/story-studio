[package]
name = "story-studio"
version = "0.1.0"
description = "Story Studio desktop shell"
authors = [ "Story Studio" ]
license-file = "../../../LICENSE.md"
edition = "2021"

[lib]
name = "story_studio_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
chrono = { version = "0.4", features = [
  "clock",
  "serde"
] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tauri = { version = "2", features = [ ] }
